name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (well under Streamlit's 12-hour sleep threshold)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manually triggering this workflow from the GitHub Actions tab, for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit app with real browser (wakes it if asleep)
        run: python scripts/wake_app.py