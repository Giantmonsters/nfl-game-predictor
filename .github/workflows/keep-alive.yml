name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (well under Streamlit's 12-hour sleep threshold)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Allows manually triggering this workflow from the GitHub Actions tab, for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app to keep it awake
        run: |
          curl -sL --max-redirs 10 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -c /tmp/cookies.txt -b /tmp/cookies.txt \
            https://nfl-game-predictor-9bacfsbwugzbnwcptra946.streamlit.app/ -o /dev/null
          echo "Pinged the app at $(date)"